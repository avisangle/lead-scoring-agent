<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <style>
    .arc { animation: arc 5s ease-in-out infinite alternate; }
    @keyframes arc { from { stroke-dashoffset: 138.7; } to { stroke-dashoffset: 37.7; } }
    .bar { animation: glow 5s ease-in-out infinite backwards; }
    .b2 { animation-delay: 0.45s; }
    .b3 { animation-delay: 0.9s; }
    @keyframes glow {
      0%, 34%, 100% { fill: #FFFFFF; fill-opacity: 0.45; }
      14% { fill: #A7F3D0; fill-opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .arc, .bar { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#11505C"/>
    </linearGradient>
    <linearGradient id="ring" x1="16" y1="16" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="24" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"/>
  <circle class="arc" cx="40" cy="40" r="24" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="150.8" stroke-dashoffset="37.7" transform="rotate(-90 40 40)"/>
  <rect class="bar b1" x="30" y="42" width="5.5" height="8" rx="1.75" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect class="bar b2" x="37.25" y="37.5" width="5.5" height="12.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.78"/>
  <rect class="bar b3" x="44.5" y="32" width="5.5" height="18" rx="1.75" fill="#FFFFFF"/>
</svg>
